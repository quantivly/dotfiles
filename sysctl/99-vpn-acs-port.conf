# /etc/sysctl.d/99-vpn-acs-port.conf
# ==================================
# Keep the AWS Client VPN's SAML assertion-consumer port out of the kernel's
# ephemeral pool.
#
# Installed root-owned by `vpn-setup`. COPIED, never symlinked — root reads this,
# the same rule CLAUDE.md states for resticprofile/profiles.toml and
# audit/99-logout-catch.rules. vpn-doctor checks three separate things: that the
# file is present, that it matches this checkout, and that the LIVE value in
# /proc actually contains the port. A file installed but never applied is the
# silent-failure shape this repo keeps finding.
#
# WHY
# ---
# The client runs a local HTTP listener on 127.0.0.1:35001 to receive the SAML
# assertion POSTed back by the browser. Measured on this machine:
#
#   net.ipv4.ip_local_port_range   = 32768 60999
#   net.ipv4.ip_local_reserved_ports = (empty)
#
# 35001 is INSIDE the ephemeral range, so any process calling bind(127.0.0.1, 0)
# can be handed the exact port the client needs, at which point the re-auth has
# nowhere to deliver the assertion and runs to the vendor's 600-second
# SAML_LOGIN_START_TIMEOUT. The app log shows `Acs did not stop correctly!` 51
# times, which is consistent with contention but is NOT proof of it — the
# reservation is cheap and has no downside either way.
#
# THIS IS AN AVAILABILITY FIX, NOT A SECURITY CONTROL
# ---------------------------------------------------
# It stops the kernel from HANDING OUT 35001 to an unrelated process as an
# ephemeral port. It does nothing whatsoever about a process that deliberately
# binds it: a explicit bind() to a reserved port still succeeds, and 127.0.0.1
# is bindable by any process running as this user. Do not read this line as
# protecting the assertion. Nothing in DO-692 depends on it for safety; the
# safety property is that no component reads a log at runtime.
net.ipv4.ip_local_reserved_ports = 35001
