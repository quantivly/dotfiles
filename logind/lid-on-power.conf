# logind/lid-on-power.conf — closing the lid on external power does nothing.
#
# The dock powers the laptop over USB-C, so this ignores a lid closed after the
# dock's power is up but before logind counts the laptop as docked (its displays
# are not up yet). On battery the lid still suspends. Closing the lid on any
# charger, not only the dock, no longer suspends: wanted.
#
# Copied root-owned to /etc/systemd/logind.conf.d/ by scripts/setup-dock-lid.sh,
# which reloads logind so it takes effect without a reboot.
# Why: docs/DOCK_LID_SUSPEND.md.
[Login]
HandleLidSwitchExternalPower=ignore
