# logind/lid-locks-never-suspends.conf — closing the lid locks the screen and never suspends.
#
# Agents run on this laptop for hours, so the lid must not stop them: neither a
# lid closed on battery nor a charger pulled with the lid already closed. Sleep
# happens only when asked for (Suspend in the system menu, `systemctl suspend`).
#
# `lock` fires on the lid-close EDGE only, never when logind re-checks a lid that
# stays closed, and any handle-lid-switch lock suppresses it: the dock holdoff,
# or gsd-power's while an external monitor is attached. So closing the lid as you
# dock does not lock the screen you are about to use, and undocking with the lid
# closed is not a lid-close, so logind does not lock then either; GNOME's idle
# lock does. Docked, the lid does nothing at all.
#
# Copied root-owned to /etc/systemd/logind.conf.d/ by scripts/setup-dock-lid.sh,
# which reloads logind so it takes effect without a reboot and removes the
# lid-on-power.conf this file replaced. Why: docs/DOCK_LID_SUSPEND.md.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
