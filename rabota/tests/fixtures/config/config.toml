# Routes and the default moved to the tenants file in DO-773 — CLAUDE_TENANT_ROUTES,
# CLAUDE_TENANT_PATH_ROUTES and CLAUDE_TENANT_DEFAULT in ~/.config/claude-tenants.zsh are the one
