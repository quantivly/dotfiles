# systemd/vpn-failfast.service.d/ipv6-block.conf
# ==============================================
# ARMS THE IPv6 BLOCK (DO-704). Installed root-owned to
# /etc/systemd/system/vpn-failfast.service.d/ by `vpn-setup --block-ipv6`,
# COPIED and never symlinked -- the same rule the unit itself follows, and for
# the same reason: root reads it, and a symlink into a working tree means a
# rebase or a half-finished checkout changes what root runs.
#
# WHY A DROP-IN RATHER THAN A DEFAULT IN THE SCRIPT. While the tunnel is up this
# makes every globally-routable IPv6 destination fail instantly, which is the
# point and is also the only way it can hurt you. That is a decision a person
# takes on a particular machine, so it is armed by a typed command -- the same
# shape `vpn-notify` and `wt-gc-sweep` are armed with in this repo -- and the
# absence of this file is the normal, supported, disarmed state. vpn-doctor
# reports "not armed" as a NOTE, never a failure.
#
# WHY IT IS ONE LINE, AND MUST STAY ONE LINE. This file is the ONLY producer of
# VPN_FAILFAST_IPV6, and the script treats an unknown value as fatal (exit 2) in
# every mode rather than defaulting in either direction -- because defaulting to
# `off` would silently disarm a machine that asked to be armed, and defaulting
# to `block` would blackhole IPv6 off a typo. So `VPN_FAILFAST_IPV6=blocked`, or
# `Block`, or a trailing space, would make --watch exit 2 on every start:
# Restart=on-failure, then StartLimitBurst, then the unit sits `failed` -- and
# IPv4 fail-fast, which works today with NRestarts=0, would be dead because of a
# typo in an OPTIONAL feature. setup-vpn-failfast.sh therefore reads the value
# back out of the installed copy and runs the installed script's own --check
# with it BEFORE `systemctl restart`, and refuses rather than restarting.
#
# Disarm with `vpn-setup --no-block-ipv6`, which removes this file, drops the
# now-empty .d directory and reloads. Withdrawal of the routes themselves is NOT
# gated on this file: --clear, the stop path and the tunnel-down branch remove
# the block however the knob is set, so disarming and restarting really does
# withdraw.

[Service]
Environment=VPN_FAILFAST_IPV6=block
