# systemd/herdr-server.service.d/10-execstart.conf
# ===============================================
# TEMPLATE. Rendered to ~/.config/systemd/user/herdr-server.service.d/ by
# scripts/herdr-unit-dropin.sh, which ./install runs. __HERDR_ROOT__ becomes the
# absolute path of the checkout that installed it (DO-564).
#
# WHY A DROP-IN AND NOT A RENDERED UNIT. herdr-server.service is a SYMLINK into
# the checkout, and two checkers derive "which checkout is live" from exactly
# that: scripts/reconcile-systemd-units.sh (managed_units, which requires -L)
# and scripts/verify-tools.sh's enablement assertion. Replacing the symlink with
# a rendered copy makes both find nothing and skip — silently, in the section
# whose own comment says a missing checker is not a pass. A copy of the unit
# would also be a copy of REVIEWED CONTENT (OOMPolicy, KillMode, Restart,
# [Install]) that stops tracking the repo the moment HEAD moves, which is the
# ~/.config/mise/config.toml failure DO-566 refused to repeat. What is rendered
# here is not content but MACHINE IDENTITY — where the checkout is — and HEAD
# cannot stale that. Same reasoning as DO-459's __BACKUP_*__ templates.
#
# The empty assignment before each real one is REQUIRED, not stylistic. Both
# settings are lists, so a drop-in that merely adds a value gets you two of
# them, and for ExecStart on a Type=simple unit systemd then refuses the unit
# outright: "Service has more than one ExecStart= setting, which is only allowed
# for Type=oneshot services. Refusing." Verified with
# `systemd-analyze verify --user` under SYSTEMD_UNIT_PATH, both ways round.
#
# The base unit keeps a working ExecStart for the conventional ~/.dotfiles
# location, so a `git pull` that has not been followed by ./install still leaves
# a STARTABLE unit there. That is deliberate: this box's herdr server hosts every
# agent pane, and a unit that refuses to load after a plain pull would take the
# fleet down at the next boot. It does mean the base value is the right answer
# in exactly one place, which is why verify-tools.sh asserts the EFFECTIVE
# ExecStart against the checkout the unit symlink resolves to rather than
# asserting that this file exists.

# SCOPE, and it is enforced rather than requested. This drop-in carries exactly
# two settings, both derived from ONE fact — where the checkout is. ExecStart is
# asserted semantically by `herdr-unit-dropin.sh --check`; Documentation is
# cosmetic (`systemctl status`). There is deliberately NO byte-level drift check
# against this template: it would report drift on every machine the moment
# somebody edited a comment up here, and a checker that cries wolf over a comment
# is one people stop reading. The cost of that choice is that a setting added
# below would be rendered into new installs and silently absent from existing
# ones — so scripts/test-herdr-modular.sh FAILS if this file declares any
# setting other than these two, and tells you to extend --check instead.

# Both values are QUOTED, always, even though the path usually needs no quoting.
# systemd splits an unquoted value on whitespace, so a checkout at
# ~/my dotfiles rendered `ExecStart=/home/me/my dotfiles/scripts/...` and systemd
# looked for a binary called `/home/me/my` — 203/EXEC, which is precisely the
# failure DO-564 exists to remove, reintroduced for anyone with a space in their
# path. Quoting unconditionally rather than only-when-needed is deliberate: a
# conditional would put the space case on a branch that never runs here, and this
# repo has already shipped one row that could not reach the branch it named.

[Unit]
Documentation=
Documentation="file://__HERDR_ROOT__/docs/HERDR_GUIDE.md"

[Service]
ExecStart=
ExecStart="__HERDR_ROOT__/scripts/herdr-server-launch.sh"
