[package]
name = "resource-pulse-sampler"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Resource Pulse's sampler: the compiled replacement for the gjs service"
publish = false

[dependencies]
zbus = { version = "6.2", default-features = false, features = ["default-rt"] }
libc = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
panic = "unwind"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic = "deny"
