# Context budget for the always-loaded prose surfaces of this repository.
#
# WHY THIS EXISTS. CLAUDE.md is loaded into context on every request of every
# session. It sat between 14k and 36k chars for eight months and then went
# 35,682 -> 350,324 in the nineteen days from 2026-08-30 to 2026-09-18, because
# every PR appended its own review narrative (+26,499 for #160, +21,404 for
# #134, +20,758 for #135). That is ~87k tokens per request, and Anthropic's
# stated reason for warning past 150k chars is that "longer files consume more
# context and reduce adherence" -- i.e. the file stops producing the behaviour
# it was written to produce. This repo already ran the one-off fix: 2026-01-07,
# "doc: Streamlined CLAUDE.md to reduce size by 62%", 32.6k -> 14.2k. It regrew
# 25x. So the cut is not the deliverable; the ratchet is.
#
# Prior art, deliberately copied rather than reinvented: nanoclaw's
# scripts/context-budget.json + scripts/check-context-budget.test.ts, a
# lower-only ratchet over every always-loaded surface, in production since
# IMP-2376 with an 89,989-char ratchet_history.
#
# FORMAT. Plain KEY=value, one per line, decimal integers only. Parsed with
# grep/sed by scripts/check-claude-md.sh -- NEVER sourced, because sourcing a
# config file executes it and a typo then fails silently in whichever direction
# the shell happens to take. A missing or non-numeric key is exit 2 ("could not
# run"), never a pass.
#
# THE CLAUDE.md CEILING IS NOT IN THIS FILE, AND THAT IS THE POINT. It is
# derived by the checker as max(FLOOR, min(size over base-branch commits that
# also carry the checker) + SLACK). Every design where a human writes the
# ceiling down has the same hole: the PR that breaks the rule edits the number
# in the same diff, reviewed by the person who wrote it. There is no ceiling
# value here to raise. The only way to raise it is to lower CLAUDE.md and merge,
# which is the goal.
#
# FLOOR and SLACK live in the checker as constants, not here, for the same
# reason -- they are integrity-critical and are pinned behaviourally by rows in
# scripts/test-claude-md.sh rather than by grepping a literal.
#
# THESE KEYS MAY ONLY BE LOWERED. Raising one requires a RATCHET HISTORY entry
# below saying what was measured and why. That convention is review-enforced,
# not machine-enforced; the machine-enforced half is the derived ceiling above.

# A .claude/rules/*.md trigger card. Cards carry imperative lines and links,
# never prose -- this cap IS the prose detector, which is why there is no
# separate prose rule (no mechanical definition of prose has an acceptable
# false-positive rate, and a second failure mode enforcing nothing is pure
# false-positive surface).
RULE_CARD_MAX_BYTES=2000

# A .claude/skills/<name>/SKILL.md. Seeded ABOVE the measured house norm on
# purpose. Measured on this machine 2026-09-18: herdr 10,553 / rabota 17,539 /
# zvi-voice 11,883 / quantivly-conventions:linear 29,335 / :prs 26,696. A
# 5,000-byte cap -- which an earlier draft of this work proposed -- would have
# failed every skill that exists here, i.e. shipped red. nanoclaw's
# CONTRIBUTING.md says "under 500 lines"; 30,000 bytes is about that.
#
# references/, scripts/ and assets/ under a skill are deliberately NOT capped.
# Capping them would punish the progressive disclosure the house style already
# uses (rabota/SKILL.md:66-71 is a table of reference-file -> when-to-read-it),
# and the whole point of a reference file is that it is not always loaded.
SKILL_MD_MAX_BYTES=30000

# How much the rule-card layer may add ON TOP of the CLAUDE.md ceiling.
#
# MEASURED 2026-09-18 on Claude Code 2.1.277: a card WITHOUT `paths:` loads into
# every session, and a card WITH `paths:` never loads at all (not at start, not
# after reading a matching file, in any spelling). The checker forbids `paths:`,
# so every card is unconditional and always loaded -- counting them here is
# accuracy, not caution.
#
# It may not be unbounded: the obvious way to defeat a CLAUDE.md ceiling is to
# move prose into another always-loaded surface, which is what the aggregate
# rule exists to stop. 18,000 is nine cards at the 2,000 cap -- roughly one per
# area of this repo. Since a card costs exactly what a line in CLAUDE.md costs,
# prefer CLAUDE.md until scoping works; this is the number to TIGHTEN if cards
# start being used as overflow, never the one to raise.
AGGREGATE_EXTRA_BYTES=18000

# RATCHET HISTORY
# date       key                    from -> to    why
# 2026-09-18 RULE_CARD_MAX_BYTES    -    -> 2000  initial; no cards exist yet
# 2026-09-18 SKILL_MD_MAX_BYTES     -    -> 30000 initial; seeded above the
#                                                 measured house norm (29,335)
# 2026-09-18 AGGREGATE_EXTRA_BYTES  -    -> 18000 initial; nine cards at the cap.
#                                                 Set after the first card made
#                                                 the aggregate budget SLACK
#                                                 (1,500) i.e. one card ever.
