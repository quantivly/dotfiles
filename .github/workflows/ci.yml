name: CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run ShellCheck on all shell scripts
        run: |
          # Find shell scripts with shebangs (exclude dotbot submodule)
          scripts=$(find . \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) -print0 | \
                    xargs -0 grep -l "^#!" 2>/dev/null | \
                    grep -v "dotbot/" || true)

          if [ -n "$scripts" ]; then
            echo "Checking scripts: $scripts"
            echo "$scripts" | xargs shellcheck -x
          else
            echo "No shell scripts found to check"
          fi

      - name: Check install script
        run: shellcheck -x install

  syntax-check:
    name: Shell Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        uses: ./.github/actions/apt-install
        with:
          packages: zsh

      - name: Check bash syntax
        run: bash -n install

      # zsh/functions/*.sh is included deliberately: it is the largest zsh in
      # the repo and no other CI job reads it. The shellcheck job selects files
      # by a `^#!` shebang and these have none (they are sourced, not run), and
      # pre-commit's shellcheck excludes the directory outright because the
      # syntax is zsh, not bash. Without this line a syntax error there is
      # caught only if some test happens to source the file.
      # scripts/claude-pick is named EXPLICITLY, and it is the only check that
      # reads it: it is zsh, so pre-commit's ShellCheck excludes it and CI's
      # ShellCheck job never selects it (that job globs *.sh/*.bash/*.zsh, and
      # this is an extensionless command on ~/.local/bin). Without this line the
      # repo's newest executable would have no syntax check at all.
      - name: Check zsh syntax for all modules
        run: |
          for file in zsh/zshrc.* zsh/functions/*.sh zshrc p10k.zsh scripts/claude-pick; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              zsh -n "$file" || exit 1
            fi
          done

  backup-external-test:
    name: Backup External-HDD State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        uses: ./.github/actions/apt-install
        with:
          packages: zsh

      # The external-HDD steps decide, from a handful of disk/fstab states,
      # whether to write to /etc/fstab. Every bug found in them so far was a
      # guard that only misfires in a state the author's machine was not in, and
      # reports success. Shellcheck cannot see that class, so the state table is
      # executed here rather than left to "run it after touching these steps".
      # Needs only util-linux + systemd, and no root.
      - name: Run the external-HDD state table
        run: ./scripts/test-backup-external.sh

  systemd-reconcile-test:
    name: systemd Unit Enablement State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The defect here is a .wants/ symlink in the wrong directory: systemd
      # records [Install] at `enable` time, so editing WantedBy= moves nothing
      # and `systemctl status` stays happy while what actually starts is the old
      # target. Invisible, and it cost every pane its session environment after
      # one reboot with every check on the machine green.
      #
      # The comparison is pure filesystem state, so this needs no systemd user
      # manager — which matters, because a runner has none and a suite that
      # skips in CI is a suite that never runs.
      - name: Run the unit-enablement state table
        run: ./scripts/test-systemd-reconcile.sh

  dotfiles-guard-test:
    name: Dotfiles Live-Config Guard State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        uses: ./.github/actions/apt-install
        with:
          packages: zsh

      # This repo installs itself with dotbot `link:`, so a checkout IS a deploy
      # and the guard's job is to notice when the running config is not the
      # reviewed config. Every bug found in it so far printed a green tick rather
      # than an error — a blanked PATH, and a diff against a ref that did not
      # exist — so the states are executed here, not left to a hand-run on a
      # machine that happens to be in the passing one. Needs zsh, git and awk;
      # builds its own fixture repo, so no real checkout and no network.
      - name: Run the live-config guard state table
        run: ./scripts/test-dotfiles-guard.sh

  hspawn-test:
    name: hspawn / hdespawn / hreap State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh and jq
        uses: ./.github/actions/apt-install
        with:
          packages: zsh jq

      # These three commands create worktrees, type into agent panes and DELETE
      # worktrees, and every failure found in them so far was silent: a spawn
      # that returned 0 with its agent parked on a dialog, a registry entry
      # overwritten without a word, a `--yes` refusal over commits that were
      # already pushed. The suite puts a recording `herdr` STUB at the front of
      # PATH for every run — not "no herdr on PATH", because the machine this
      # code is written on has a real one talking to a live server, and a suite
      # that relied on absence would pass here and remove a real workspace
      # there. Needs zsh, git and jq; builds its own git repo with a bare
      # origin, so no network, no herdr and no real panes.
      - name: Run the hspawn state table
        run: ./scripts/test-hspawn.sh

  claude-doctor-test:
    name: Claude Account & MCP Doctor State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh and jq
        uses: ./.github/actions/apt-install
        with:
          packages: zsh jq

      # Every fault claude-doctor reports was, before it, reported by nothing:
      # plugin:desktop-commander connected 0 times in 509 attempts over 34 days,
      # the claude.ai Linear connector 404'd 1936 times, and the slack
      # credential was twice caught mid-write with a zero-length accessToken —
      # all while every status surface stayed green. So the rows assert against
      # the states that produce a GREEN TICK, not against obvious errors.
      #
      # The suite builds its PATH from scratch and puts a recording `clauth`
      # STUB in front — not "no clauth on PATH", because the machine this was
      # written on has a real one wired to a daemon that owns four live Claude
      # accounts, and `clauth <profile>` REWRITES the machine's credentials. The
      # first draft of this suite inherited $PATH and ran that real binary.
      - name: Run the claude-doctor state table
        run: ./scripts/test-claude-doctor.sh

  claude-account-dirs-test:
    name: Claude Account Dirs State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq
        uses: ./.github/actions/apt-install
        with:
          packages: jq

      # scripts/claude-account-dirs.sh builds the persistent per-profile
      # CLAUDE_CONFIG_DIR that lets a session be isolated AND still lead a herdr
      # team. Every row is written against a state that produces a
      # SUCCESSFUL-looking build, because that is how its predecessor failed: it
      # seeded .claude.json from ~/.claude/.claude.json, a 1,156-byte husk with
      # no projects, no hasCompletedOnboarding and a different machineID. That is
      # still valid JSON, so the build "worked" and every session would have
      # started with first-run onboarding and a trust dialog in every worktree.
      #
      # Hermetic via a fixture $HOME, and that is load-bearing rather than tidy:
      # the script writes to ~/.local/state and reads ~/.clauth/profiles, which on
      # the machine this was written on hold four live Claude logins.
      - name: Run the claude-account-dirs state table
        run: ./scripts/test-claude-account-dirs.sh

  claude-pick-test:
    name: Claude Account Picker State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh and jq
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      # The picker decides WHICH ACCOUNT IS BILLED, and nothing announces that
      # afterwards: a wrong answer is not an error, it is a session quietly
      # spending the wrong seat. So every row is written against a state that
      # produces a plausible-looking pick rather than a failure — which is how
      # its parts actually broke. An absent `resets_at` read as 0 put a fresh
      # window at maximum "about to expire" urgency; a jq `// empty` inside an
      # array shifted every column after an absent field into the wrong variable;
      # the ledger was written with a literal backslash-t, so it looked written
      # and read back empty; and `zsystem flock` opens without O_CREAT, so the
      # pick lock had never once been acquired while the row covering it asserted
      # the warning that state produces.
      #
      # Hermetic via a fixture $HOME with CLAUDE_CONFIG_DIR and HERDR_PANE_ID
      # cleared, and a NON-UTC fixture TZ — the RFC 3339 rows are unfailable on a
      # UTC machine, which is exactly what this runner is.
      - name: Run the account picker state table
        run: ./scripts/test-claude-pick.sh

  herdr-modular-test:
    name: Modular herdr Checks State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh and jq
        uses: ./.github/actions/apt-install
        with:
          packages: zsh jq

      # The two commands a modular adopter actually runs -- `verify-tools.sh
      # --herdr` and `herdr-claude-wire.sh` -- plus the assertion that
      # `herdr-help` lives in the layer they source.
      #
      # Most rows assert that something was NOT written or NOT reported, which
      # is also what a suite whose subjects vanished produces, so the suite
      # asserts its subjects exist before anything else. It stubs `herdr` at the
      # front of PATH rather than relying on its absence: the machine this was
      # written on has a real one wired to a live server, and the wirer
      # regenerates a file under $HOME. Fake $HOME per row; no network.
      - name: Run the modular herdr state table
        run: ./scripts/test-herdr-modular.sh

  herdr-modular-install:
    name: Modular herdr Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # zsh so the ONLY required dependency missing on the runner is herdr
      # itself, which makes the exit-status assertion below exact.
      - name: Install jq and zsh
        uses: ./.github/actions/apt-install
        with:
          packages: jq zsh

      # install.conf.herdr.yaml is asserted by nothing else. dotfiles-doctor's
      # link map hardcodes install.conf.yaml (_dotfiles_link_map), so its
      # declared-source-exists check skips this file entirely, and install-test
      # below only ever runs the full install. A typo in a source path here is
      # therefore invisible until an adopter runs it -- dotbot fails loudly with
      # "Nonexistent target", but on their machine, never on ours.
      - name: --herdr links exactly the five herdr destinations
        run: |
          set -euo pipefail
          FAKE="$(mktemp -d)"
          # No HERDR_ALLOW_FOREIGN_CHECKOUT any more (DO-564): the runner's
          # checkout is under /home/runner/work, which is now a supported place to
          # install from, and this step is the proof. It used to need that override
          # because the unit's ExecStart was an absolute ~/.dotfiles path.
          # --herdr now exits with the dependency status, and a runner has no
          # herdr binary, so a bare call would take this step down under `-e`
          # before any link was inspected. Capture it: the LINKS are what this
          # step is about, and the status gets its own assertion just below.
          rc=0
          HOME="$FAKE" \
          DOTFILES_ALLOW_WORKTREE_INSTALL=1 \
            ./install --herdr >/tmp/herdr-install.out 2>&1 || rc=$?
          cat /tmp/herdr-install.out
          # Exactly 1: herdr is the only required dependency absent here (the
          # step above installs jq and zsh; git and python3 are preinstalled).
          # A 0 would mean the deps report stopped being consulted at all.
          [[ $rc -eq 1 ]] || { echo "::error::expected exit 1 (no herdr), got $rc"; exit 1; }
          # Destination -> source. Asserting the destination set and that links
          # merely RESOLVE is not enough: repointing a source at another real file
          # in this repo passes both. That is the fourth failure direction
          # dotfiles-doctor already names -- linked-inside-the-checkout-but-at-the-
          # wrong-file -- and it would ship a systemd unit whose content is the
          # gitconfig, green forever.
          declare -A want=(
            [.claude/hooks/session-statusline.sh]=claude/hooks/session-statusline.sh
            [.config/herdr/config.toml]=config/herdr/config.toml
            [.config/herdr/plugins/config/herdr-lazy/plugins.list]=config/herdr/plugins/plugins.list
            [.config/herdr/plugins/config/herdr-lazy/plugins.lock]=config/herdr/plugins/plugins.lock
            [.config/systemd/user/herdr-server.service]=systemd/herdr-server.service
          )
          mapfile -t got < <(cd "$FAKE" && find . -type l | sed 's|^\./||' | sort)
          mapfile -t exp < <(printf '%s\n' "${!want[@]}" | sort)
          printf '%s\n' "${got[@]}"
          if [[ "${got[*]}" != "${exp[*]}" ]]; then
            echo "::error::--herdr link set changed"
            printf 'wanted: %s\n' "${exp[*]}"
            exit 1
          fi
          for l in "${got[@]}"; do
            [[ -e "$FAKE/$l" ]] || { echo "::error::dangling link: $l"; exit 1; }
            actual="$(readlink -f "$FAKE/$l")"
            expect="$(readlink -f "${want[$l]}")"
            [[ "$actual" == "$expect" ]] || {
              echo "::error::$l points at $actual, expected $expect"; exit 1; }
          done
          # And the takeover this flag exists to avoid must not have happened.
          for f in .zshrc .gitconfig .tmux.conf .p10k.zsh .config/mise/config.toml; do
            [[ -e "$FAKE/$f" ]] && { echo "::error::--herdr created $f"; exit 1; }
          done
          echo "5 links, all resolving, nothing else touched."

          # DO-566. plugins.list/plugins.lock are links INTO the checkout, so
          # herdr-lazy writes through them -- correct for us, and for an adopter
          # without push access it is permanent unpublishable dirt plus a pull
          # that conflicts on a file a tool wrote for them. The only place that
          # warning reaches them in time is here, standing in the installer's
          # output, so assert it is still printed.
          grep -qi 'fork' /tmp/herdr-install.out \
            || { echo "::error::next-steps no longer tells an adopter to fork"; exit 1; }
          grep -q 'upstream' /tmp/herdr-install.out \
            || { echo "::error::next-steps no longer names the upstream remote"; exit 1; }
          # And the section it sends them to has to exist: a pointer into a doc
          # keeps printing perfectly after the heading it names is renamed --
          # green tick, dead end. The title is read out of the pointer line
          # itself rather than restated here, because a third copy of it would
          # only be one more thing to forget to rename.
          # `|| true` because the step runs under `set -e` with pipefail: an
          # empty grep would otherwise kill the step on the assignment itself,
          # replacing the diagnosis below with a bare non-zero exit.
          sec="$(sed -n '/docs\/HERDR_GUIDE.md/,+1p' /tmp/herdr-install.out \
                 | grep -o '"[^"]*"' | head -1 | tr -d '"' || true)"
          [[ -n "$sec" ]] \
            || { echo "::error::next-steps no longer names a HERDR_GUIDE section"; exit 1; }
          grep -qF "### $sec" docs/HERDR_GUIDE.md \
            || { echo "::error::install points at HERDR_GUIDE section '$sec', which does not exist"; exit 1; }
          echo "update path: fork + upstream named, pointing at a section that exists."

      # DO-564. The inverse of the step this replaces, which asserted that
      # --herdr REFUSED any checkout but ~/.dotfiles. A runner is a foreign
      # checkout, so this is the real thing rather than a simulation of it.
      - name: --herdr installs from a foreign checkout and pins ExecStart to it
        run: |
          set -uo pipefail
          FAKE="$(mktemp -d)"
          rc=0
          HOME="$FAKE" DOTFILES_ALLOW_WORKTREE_INSTALL=1 ./install --herdr >/tmp/out 2>&1 || rc=$?
          cat /tmp/out
          # 1 = "no herdr binary", the same dependency status the step above
          # asserts. Anything else means the install itself failed.
          [[ $rc -eq 1 ]] || { echo "::error::expected exit 1 (no herdr), got $rc"; exit 1; }
          # The DELETED message, verbatim -- not a loose 'refus' match. The
          # next-steps block legitimately contains the word ("It refuses to touch
          # a statusLine that belongs to something else"), so the loose form
          # failed this step against a perfectly good install.
          grep -qF 'Refusing --herdr from' /tmp/out \
            && { echo "::error::--herdr still refuses a foreign checkout"; exit 1; }

          # The drop-in must exist and name THIS checkout's launcher. Asserting it
          # merely exists is not enough: the whole defect being fixed is an
          # ExecStart pointing at a launcher that is not there.
          D="$FAKE/.config/systemd/user/herdr-server.service.d/10-execstart.conf"
          [[ -f "$D" ]] || { echo "::error::no ExecStart drop-in rendered"; exit 1; }
          cat "$D"
          # Quoted: systemd splits an unquoted value on whitespace, so a
          # checkout path with a space would otherwise name a binary that is not
          # there -- the very 203/EXEC this PR removes.
          want="$PWD/scripts/herdr-server-launch.sh"
          grep -qxF "ExecStart=\"$want\"" "$D" \
            || { echo "::error::drop-in does not pin ExecStart to $want"; exit 1; }
          # The empty reset must precede it, or systemd refuses the unit outright
          # with "Service has more than one ExecStart=".
          grep -qxF 'ExecStart=' "$D" \
            || { echo "::error::drop-in lacks the empty ExecStart= reset"; exit 1; }
          # No placeholder may survive: ExecStart=/scripts/... is not a degraded
          # result, it is a unit pointing at the filesystem root.
          grep -q '__HERDR_' "$D" \
            && { echo "::error::unresolved placeholder in the drop-in"; exit 1; }

          # And the merged unit must actually load. systemd-analyze verify needs
          # no manager and no running server, which is the only way to test this:
          # a running server keeps its old ExecStart until a restart that would
          # end every agent session.
          if command -v systemd-analyze >/dev/null 2>&1; then
            out="$(SYSTEMD_UNIT_PATH="$FAKE/.config/systemd/user" \
                   systemd-analyze verify --user herdr-server.service 2>&1 || true)"
            echo "$out"
            grep -qi 'more than one ExecStart' <<<"$out" \
              && { echo "::error::merged unit has two ExecStart settings"; exit 1; }
            grep -qi 'not executable' <<<"$out" \
              && { echo "::error::merged unit ExecStart is not executable"; exit 1; }
          fi

          # The outcome assertion the adopter actually runs.
          HOME="$FAKE" ./scripts/herdr-unit-dropin.sh --check \
            || { echo "::error::--check rejects the install it just performed"; exit 1; }
          echo "installed from a foreign checkout; ExecStart pinned and merged unit valid."

      # Both directions. A runner has no herdr, so the bare script correctly
      # exits 1 here -- asserting "it runs cleanly" would have been asserting
      # that herdr is NOT required, which is the opposite of the contract.
      - name: Dependency report classifies required vs optional
        run: |
          set -uo pipefail
          D="$(mktemp -d)"
          for b in bash sed head tr git dirname python3 jq zsh; do
            ln -sf "$(command -v $b)" "$D/$b"
          done

          # `rc=0; cmd || rc=$?` rather than `cmd; rc=$?`: GitHub runs steps under
          # `bash -e {0}`, which a `set +e` inside the script does not undo for the
          # step's own shell -- the previous version died on the first deliberate
          # non-zero exit before it could read $?.
          # No herdr -> required missing -> exit 1.
          rc=0
          env -i HOME=/nonexistent PATH="$D" bash ./scripts/herdr-deps-check.sh >/tmp/a 2>&1 || rc=$?
          [[ $rc -eq 1 ]] || { cat /tmp/a; echo "::error::no herdr should exit 1, got $rc"; exit 1; }
          grep -q 'herdr' /tmp/a || { echo "::error::herdr not named in the report"; exit 1; }

          # Stub herdr present, node/bun/cargo still absent -> optional only -> exit 0.
          printf '#!/bin/sh\necho "herdr 0.0.0-stub"\n' > "$D/herdr"
          chmod +x "$D/herdr"
          rc=0
          env -i HOME=/nonexistent PATH="$D" bash ./scripts/herdr-deps-check.sh >/tmp/b 2>&1 || rc=$?
          [[ $rc -eq 0 ]] || { cat /tmp/b; echo "::error::optional-only should exit 0, got $rc"; exit 1; }
          grep -q 'All required dependencies present' /tmp/b \
            || { cat /tmp/b; echo "::error::expected the all-present line"; exit 1; }

          # With no mise it must name versions rather than offer `mise use -g`.
          grep -q 'however you prefer to get them' /tmp/b \
            || { cat /tmp/b; echo "::error::mise-absent branch not taken"; exit 1; }

          # python3 REQUIRED has its own guard: both cases above carry python3, so
          # demoting it back to optional would change neither outcome and pass green.
          # herdr-lazy() resolves its binary through a python3 one-liner, so an
          # empty $root there is a silent wrong-path failure, not a missing feature.
          rm -f "$D/python3"
          rc=0
          env -i HOME=/nonexistent PATH="$D" bash ./scripts/herdr-deps-check.sh >/tmp/c 2>&1 || rc=$?
          [[ $rc -eq 1 ]] || { cat /tmp/c; echo "::error::no python3 should exit 1, got $rc"; exit 1; }

          # Same for zsh: the shell layer next-step 1 tells you to source is hard zsh.
          ln -sf "$(command -v python3)" "$D/python3"
          rm -f "$D/zsh"
          rc=0
          env -i HOME=/nonexistent PATH="$D" bash ./scripts/herdr-deps-check.sh >/tmp/d 2>&1 || rc=$?
          [[ $rc -eq 1 ]] || { cat /tmp/d; echo "::error::no zsh should exit 1, got $rc"; exit 1; }
          echo "required (herdr, python3, zsh) exit 1; optional-only exits 0; mise-absent branch OK."

  gh-routing-test:
    name: GitHub Account Routing State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        uses: ./.github/actions/apt-install
        with:
          packages: zsh

      # gh keys its tokens by HOST, not by config dir, so several config dirs
      # declaring different accounts can all resolve to one — while
      # `gh auth status` keeps reporting the declared one. gh-doctor exists to
      # catch that, which makes a gh-doctor that reports agreement when there is
      # none worse than none at all. gh itself is stubbed, so the runner needs
      # no credentials, no keyring and no network; the stub reproduces the
      # collapse, which a real gh cannot be made to do on demand.
      - name: Run the gh account routing state table
        run: ./scripts/test-gh-routing.sh

  secret-guard-test:
    name: Secret Emission Guard State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Both live GitHub tokens on the author's machine were found in plaintext
      # in five session transcripts, two of them days old — not through any
      # dramatic mistake, but because ordinary diagnostics print secrets and
      # everything printed is recorded. These two files attack the emission.
      # Most rows assert what the guard must NOT block: a hook that refuses
      # ordinary commands gets deleted within a day, and then it protects
      # nothing. Needs bash, jq and sed; no network and no secrets.
      - name: Run the secret emission guard state table
        run: ./scripts/test-secret-guard.sh

  workflow-apt-test:
    name: Workflow apt Guard State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PyYAML, because the checker parses YAML with a real parser rather than
      # by hand. Three review rounds found six ways a hand-written parser went
      # QUIET -- each printing a full row of green ticks over a complete
      # restoration of the outage this guard exists to prevent -- so the
      # dependency is deliberate. It is installed through this repository's own
      # composite action, which is the thing under test: if the action is
      # broken, this job fails loudly, which is the correct outcome.
      - name: Install PyYAML
        uses: ./.github/actions/apt-install
        with:
          packages: python3-yaml

      - name: Run the workflow-apt state table
        run: ./scripts/test-workflow-apt.sh

  yaml-validation:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: false
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              document-start: disable
              truthy:
                allowed-values: ['true', 'false', 'yes', 'no']

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  prerequisites-test:
    name: Prerequisites Installer Test (Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        uses: ./.github/actions/apt-install
        with:
          packages: zsh git curl build-essential

      - name: Run prerequisites installer
        run: ./scripts/install-prerequisites.sh

      - name: Test idempotency (re-run should succeed)
        run: ./scripts/install-prerequisites.sh

      - name: Verify oh-my-zsh installed
        run: |
          test -d ~/.oh-my-zsh || (echo "oh-my-zsh not installed" && exit 1)
          echo "✅ oh-my-zsh verified"

      - name: Verify Powerlevel10k installed
        run: |
          test -d ~/.oh-my-zsh/custom/themes/powerlevel10k || (echo "Powerlevel10k not installed" && exit 1)
          echo "✅ Powerlevel10k verified"

      - name: Verify zsh plugins installed
        run: |
          test -d ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions || (echo "zsh-autosuggestions not installed" && exit 1)
          test -d ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting || (echo "zsh-syntax-highlighting not installed" && exit 1)
          test -d ~/.oh-my-zsh/custom/plugins/zsh-fzf-history-search || (echo "zsh-fzf-history-search not installed" && exit 1)
          echo "✅ zsh plugins verified"

      - name: Verify fzf installed
        run: |
          command -v fzf || test -d ~/.fzf || (echo "fzf not installed" && exit 1)
          echo "✅ fzf verified"

  install-test:
    name: Installation Test (Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise (for tool availability)
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run dotbot installation
        run: ./install

      - name: Verify symlinks created
        run: |
          test -L ~/.zshrc || (echo "~/.zshrc symlink not created" && exit 1)
          test -L ~/.gitconfig || (echo "~/.gitconfig symlink not created" && exit 1)
          echo "✅ Symlinks verified"

      - name: Verify mise config deployed
        run: |
          test -f ~/.config/mise/config.toml || (echo "mise config not deployed" && exit 1)
          echo "✅ Mise config verified"

