name: CI

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run ShellCheck on all shell scripts
        run: |
          # Find shell scripts with shebangs (exclude dotbot submodule)
          scripts=$(find . \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) -print0 | \
                    xargs -0 grep -l "^#!" 2>/dev/null | \
                    grep -v "dotbot/" || true)

          if [ -n "$scripts" ]; then
            echo "Checking scripts: $scripts"
            echo "$scripts" | xargs shellcheck -x
          else
            echo "No shell scripts found to check"
          fi

      - name: Check install script
        run: shellcheck -x install

  syntax-check:
    name: Shell Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check bash syntax
        run: bash -n install

      # zsh/functions/*.sh is included deliberately: it is the largest zsh in
      # the repo and no other CI job reads it. The shellcheck job selects files
      # by a `^#!` shebang and these have none (they are sourced, not run), and
      # pre-commit's shellcheck excludes the directory outright because the
      # syntax is zsh, not bash. Without this line a syntax error there is
      # caught only if some test happens to source the file.
      - name: Check zsh syntax for all modules
        run: |
          for file in zsh/zshrc.* zsh/functions/*.sh zshrc p10k.zsh; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              zsh -n "$file" || exit 1
            fi
          done

  backup-external-test:
    name: Backup External-HDD State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The external-HDD steps decide, from a handful of disk/fstab states,
      # whether to write to /etc/fstab. Every bug found in them so far was a
      # guard that only misfires in a state the author's machine was not in, and
      # reports success. Shellcheck cannot see that class, so the state table is
      # executed here rather than left to "run it after touching these steps".
      # Needs only util-linux + systemd, and no root.
      - name: Run the external-HDD state table
        run: ./scripts/test-backup-external.sh

  systemd-reconcile-test:
    name: systemd Unit Enablement State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The defect here is a .wants/ symlink in the wrong directory: systemd
      # records [Install] at `enable` time, so editing WantedBy= moves nothing
      # and `systemctl status` stays happy while what actually starts is the old
      # target. Invisible, and it cost every pane its session environment after
      # one reboot with every check on the machine green.
      #
      # The comparison is pure filesystem state, so this needs no systemd user
      # manager — which matters, because a runner has none and a suite that
      # skips in CI is a suite that never runs.
      - name: Run the unit-enablement state table
        run: ./scripts/test-systemd-reconcile.sh

  dotfiles-guard-test:
    name: Dotfiles Live-Config Guard State Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # This repo installs itself with dotbot `link:`, so a checkout IS a deploy
      # and the guard's job is to notice when the running config is not the
      # reviewed config. Every bug found in it so far printed a green tick rather
      # than an error — a blanked PATH, and a diff against a ref that did not
      # exist — so the states are executed here, not left to a hand-run on a
      # machine that happens to be in the passing one. Needs zsh, git and awk;
      # builds its own fixture repo, so no real checkout and no network.
      - name: Run the live-config guard state table
        run: ./scripts/test-dotfiles-guard.sh

  yaml-validation:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: false
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              document-start: disable
              truthy:
                allowed-values: ['true', 'false', 'yes', 'no']

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  prerequisites-test:
    name: Prerequisites Installer Test (Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y zsh git curl build-essential

      - name: Run prerequisites installer
        run: ./scripts/install-prerequisites.sh

      - name: Test idempotency (re-run should succeed)
        run: ./scripts/install-prerequisites.sh

      - name: Verify oh-my-zsh installed
        run: |
          test -d ~/.oh-my-zsh || (echo "oh-my-zsh not installed" && exit 1)
          echo "✅ oh-my-zsh verified"

      - name: Verify Powerlevel10k installed
        run: |
          test -d ~/.oh-my-zsh/custom/themes/powerlevel10k || (echo "Powerlevel10k not installed" && exit 1)
          echo "✅ Powerlevel10k verified"

      - name: Verify zsh plugins installed
        run: |
          test -d ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions || (echo "zsh-autosuggestions not installed" && exit 1)
          test -d ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting || (echo "zsh-syntax-highlighting not installed" && exit 1)
          test -d ~/.oh-my-zsh/custom/plugins/zsh-fzf-history-search || (echo "zsh-fzf-history-search not installed" && exit 1)
          echo "✅ zsh plugins verified"

      - name: Verify fzf installed
        run: |
          command -v fzf || test -d ~/.fzf || (echo "fzf not installed" && exit 1)
          echo "✅ fzf verified"

  install-test:
    name: Installation Test (Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise (for tool availability)
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run dotbot installation
        run: ./install

      - name: Verify symlinks created
        run: |
          test -L ~/.zshrc || (echo "~/.zshrc symlink not created" && exit 1)
          test -L ~/.gitconfig || (echo "~/.gitconfig symlink not created" && exit 1)
          echo "✅ Symlinks verified"

      - name: Verify mise config deployed
        run: |
          test -f ~/.config/mise/config.toml || (echo "mise config not deployed" && exit 1)
          echo "✅ Mise config verified"

  # security-scan:
  #   name: Security Scan
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0  # Full history for gitleaks
  #
  #     - name: Run gitleaks
  #       uses: gitleaks/gitleaks-action@v2
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #   # NOTE: Gitleaks action requires GITLEAKS_LICENSE secret for organization repos
  #   # Pre-commit hook runs gitleaks locally instead

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links in Markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/workflows/markdown-link-check-config.json'
          use-quiet-mode: 'yes'

      - name: Verify required documentation exists
        run: |
          required_docs=(
            "README.md"
            "CLAUDE.md"
            "docs/SSH_SIGNING_SETUP.md"
            "docs/SECURITY_INCIDENTS.md"
            "examples/git-workflows.md"
          )

          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing required documentation: $doc"
              exit 1
            fi
          done

          echo "✅ All required documentation present"

  version-sync:
    name: Version Documentation Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version sync
        run: |
          chmod +x scripts/sync-version-docs.sh
          scripts/sync-version-docs.sh --check
