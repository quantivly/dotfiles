- defaults:
    link:
      relink: true
      create: true
      backup: true

- clean: ['~', '~/.config']

- link:
    ~/.config/gh/config.yml: gh/config.yml
    ~/.config/git/ignore: config/git/ignore
    ~/.config/pypoetry/config.toml: config/pypoetry/config.toml
    ~/.config/Code/User/settings.json: vscode/settings.json
    ~/.config/helix/config.toml: helix/config.toml
    ~/.config/herdr/config.toml: config/herdr/config.toml
    # Publishes model/effort/context to the herdr agent sidebar via
    # `herdr pane report-metadata`, and doubles as Claude Code's own status line.
    # Without it the sidebar's rows_by_agent.claude tokens resolve to nothing and
    # those rows render empty, with no error anywhere. Must also be wired up as
    # "statusLine" in ~/.claude/settings.json — see docs/HERDR_GUIDE.md.
    ~/.claude/hooks/session-statusline.sh: claude/hooks/session-statusline.sh
    ~/.config/herdr/plugins/config/herdr-lazy/plugins.list: config/herdr/plugins/plugins.list
    # NOTE: this is a symlink INTO the repo, so `herdr-lazy sync`/`update` write
    # straight through and leave your dotfiles working tree dirty. That is
    # intentional — the lock is meant to be version-controlled — but it means a
    # plugin refresh shows up as an unexpected `M config/herdr/plugins/plugins.lock`.
    ~/.config/herdr/plugins/config/herdr-lazy/plugins.lock: config/herdr/plugins/plugins.lock
    # herdr server as a systemd USER unit: runs the server from a declared, clean
    # environment (scripts/herdr-server-launch.sh) instead of whichever shell last
    # restarted it — a server restarted from a team-lead pane once handed a fake
    # TMUX, the teammux shim and CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 to every
    # pane on the machine (herdr-eval F1). Linking does NOT enable or start it;
    # from a PLAIN terminal (ends every agent session):
    #   systemctl --user daemon-reload && herdr server stop && \
    #   systemctl --user enable --now herdr-server.service
    # It is wanted by graphical-session.target, not default.target, so it starts
    # once GNOME has imported the session environment — and survives logout,
    # because WantedBy propagates start only. Changing that line does NOT move an
    # existing .wants/ symlink, so the shell step at the bottom of this file
    # reconciles it (scripts/reconcile-systemd-units.sh), and
    # scripts/verify-tools.sh FAILS when it has drifted — `git checkout` here is a
    # deploy, and install is not in that path.
    ~/.config/systemd/user/herdr-server.service: systemd/herdr-server.service
    ~/.config/yazi/theme.toml: yazi/theme.toml
    ~/.config/yazi/yazi.toml: yazi/yazi.toml
    ~/.config/yazi/Catppuccin-mocha.tmTheme: yazi/Catppuccin-mocha.tmTheme
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf
    ~/.zshrc: zshrc
    ~/.p10k.zsh:
      path: p10k.zsh
      if: '[ -f p10k.zsh ]'

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - |
      # Create ~/.zshrc.local if it doesn't exist
      if [ ! -f ~/.zshrc.local ]; then
        echo "Creating ~/.zshrc.local from template..."
        cp ~/.dotfiles/examples/zshrc.local.template ~/.zshrc.local
        chmod 600 ~/.zshrc.local
        echo "✓ Created ~/.zshrc.local with Quantivly environment documentation"
        echo "  Edit this file for machine-specific config (not tracked in git)"
      else
        echo "✓ ~/.zshrc.local already exists (preserving your customizations)"
      fi
    - |
      # Create ~/.gitconfig.local if it doesn't exist
      if [ ! -f ~/.gitconfig.local ]; then
        echo "Creating ~/.gitconfig.local from template..."
        cp ~/.dotfiles/gitconfig.local.example ~/.gitconfig.local
        chmod 600 ~/.gitconfig.local
        echo "Please edit ~/.gitconfig.local to add your git user information"
      fi
    - |
      # Create SSH sockets directory for ControlMaster
      if [ ! -d ~/.ssh/sockets ]; then
        mkdir -p ~/.ssh/sockets
        chmod 700 ~/.ssh/sockets
        echo "✓ Created ~/.ssh/sockets for SSH connection multiplexing"
      fi
    - |
      # Install TPM (Tmux Plugin Manager) if not present
      if [ ! -d ~/.tmux/plugins/tpm ]; then
        git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
        echo "✓ Installed TPM (Tmux Plugin Manager)"
        echo "  Run 'prefix + I' inside tmux to install plugins"
      fi
    - |
      # Apply curated GNOME desktop settings (workstation only; no-op off GNOME)
      if command -v gsettings >/dev/null 2>&1 && \
         printf '%s' "${XDG_CURRENT_DESKTOP:-}" | grep -qi gnome; then
        bash ~/.dotfiles/scripts/apply-gnome-settings.sh
      fi
    - |
      # Keep XDG user dirs healthy on graphical workstations: prevents the broken
      # self-referential ~/Desktop, ~/Documents, ... symlinks that
      # snapd-desktop-integration creates after xdg-user-dirs-update collapses
      # missing dirs to $HOME. Idempotent; no-op when healthy; skipped on servers.
      if [ -n "${XDG_CURRENT_DESKTOP:-}" ] && command -v xdg-user-dirs-update >/dev/null 2>&1; then
        bash ~/.dotfiles/scripts/repair-xdg-user-dirs.sh
      fi
    - |
      # Reconcile systemd USER unit enablement with the unit files linked above.
      # A LINKED unit is not a RECONCILED one: systemd records [Install] at
      # `enable` time as a .wants/ symlink, so editing WantedBy= in the file moves
      # nothing — not even after daemon-reload. The script enables (which only ADDS
      # .wants links) and prunes the stale one itself; it must never use
      # `systemctl reenable`, whose disable half deletes the unit symlink dotbot
      # installs here. It gates itself: no-op without a user manager (servers,
      # containers, CI), and it acts only on a unit that is already enabled, so it
      # reconciles a decision rather than making one.
      # Relative, not ~/.dotfiles: dotbot runs shell steps with cwd set to the
      # checkout (that is why the `git submodule update` step above needs no
      # path), and the checkout is not always at ~/.dotfiles — in CI it is under
      # /home/runner/work. The guard keeps a partial checkout from failing the
      # whole install rather than skipping one step.
      if [ -f scripts/reconcile-systemd-units.sh ]; then
        bash scripts/reconcile-systemd-units.sh
      fi
    - |
      # Create ~/.backup.local from template (workstation only; no-op on servers).
      # The heavy one-time setup (restic, repos, systemd timers, LUKS header,
      # emergency kit) is a SEPARATE explicit command: `backup-setup`. ./install
      # never uses sudo and never touches the backup engine itself.
      if printf '%s' "${XDG_CURRENT_DESKTOP:-}" | grep -qi gnome; then
        if [ ! -f ~/.backup.local ]; then
          # Render to a temp file (mktemp is mode 600) and move into place only on
          # success — a failed render must not leave an empty ~/.backup.local that
          # the guard above would later mistake for a valid config.
          bl_tmp="$(mktemp)"
          if bash ~/.dotfiles/scripts/backup-render.sh ~/.dotfiles/examples/backup.local.template > "$bl_tmp"; then
            chmod 600 "$bl_tmp"; mv "$bl_tmp" ~/.backup.local
            echo "✓ Created ~/.backup.local from template"
            echo "  Edit it, then run: backup-setup   (see docs/BACKUP_AND_RESTORE_GUIDE.md)"
          else
            rm -f "$bl_tmp"
            echo "✗ Failed to render ~/.backup.local — run 'backup-init' after fixing" >&2
          fi
        else
          echo "✓ ~/.backup.local already exists (preserving your customizations)"
        fi
      fi
