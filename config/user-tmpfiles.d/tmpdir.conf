# ~/.config/user-tmpfiles.d/tmpdir.conf -> config/user-tmpfiles.d/tmpdir.conf
#
# The cleanup half of config/environment.d/tmpdir.conf. That file moves TMPDIR
# off the /tmp tmpfs to ~/.cache/tmp, and with it the cleanup /tmp got for free
# from a reboot. These two lines give it back.
#
# NOTHING APPLIES THIS FILE ON ITS OWN. Ubuntu ships the vendor
# systemd-tmpfiles-clean.timer disabled for user managers, so a rule here does
# nothing until something runs `systemd-tmpfiles --user --clean`. What runs it
# is systemd/tmpdir-clean.timer, through scripts/tmpdir-clean.sh, which first
# writes `x` lines for registered git worktrees under the root. Do not enable
# the vendor timer instead: it runs without that guard. The first `d` line IS
# that root (the script reads it from here), and a line aging a path outside it
# makes every run refuse, since the guard walks only the root. Only %h and %U
# are expanded there, and paths are not quoted.
#
# A FILE goes only when its atime, btime, ctime and mtime are ALL older than the
# age, so a file read inside the window survives. A DIRECTORY goes when its
# btime and mtime are, and only once it is empty. The `abcmBM:` prefix is the
# age-by field (man tmpfiles.d; systemd >= 248): lowercase letters are the
# timestamps counted for files, uppercase for directories. It is the default,
# abcmABM, without A. Directory atime is left out because the cleanup bumps it
# itself: tmpdir-clean.sh walks every directory under the root before each
# clean, and on a relatime mount reading a directory whose atime is a day old
# refreshes it, so with A no directory ever aged out. It protects nothing: a
# directory holding a surviving file cannot be removed anyway, and stat() does
# not touch atime. A path with its own line is skipped by its parent's cleanup,
# which is what lets the second line give Claude Code's per-session scratchpads
# (claude-<uid>/) a longer age. The evidence behind all of it: docs/TMPDIR.md.
d %h/.cache/tmp 0700 - - abcmBM:7d
e %h/.cache/tmp/claude-%U - - - abcmBM:14d
