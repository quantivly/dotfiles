# ~/.config/user-tmpfiles.d/tmpdir.conf -> config/user-tmpfiles.d/tmpdir.conf
#
# The cleanup half of config/environment.d/tmpdir.conf. That file moves TMPDIR
# off the /tmp tmpfs to ~/.cache/tmp, and with it the cleanup /tmp got for free
# from a reboot. These two lines give it back.
#
# NOTHING APPLIES THIS FILE ON ITS OWN. Ubuntu ships the vendor
# systemd-tmpfiles-clean.timer disabled for user managers, so a rule here does
# nothing until something runs `systemd-tmpfiles --user --clean`. What runs it
# is systemd/tmpdir-clean.timer, through scripts/tmpdir-clean.sh, which first
# writes `x` lines for registered git worktrees under the root. Do not enable
# the vendor timer instead: it runs without that guard.
#
# An entry goes only when its atime, mtime, btime and (for files) ctime are ALL
# older than the age, so anything read inside the window survives. A path with
# its own line is skipped by its parent's cleanup, which is what lets the second
# line give Claude Code's per-session scratchpads (claude-<uid>/) a longer age.
# The evidence behind both ages: docs/TMPDIR.md.
d %h/.cache/tmp 0700 - - 7d
e %h/.cache/tmp/claude-%U - - - 14d
